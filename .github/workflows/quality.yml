name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test,ml,search,redis]"
      - name: Unit and contract tests
        run: pytest
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy src scripts
      - name: Dependency vulnerability audit
        run: python -m pip_audit --skip-editable
      - name: High-confidence secret scan
        shell: bash
        run: |
          if rg --hidden --glob '!.git/**' --glob '!.venv/**' \
            '(-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|gh[opsu]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' .; then
            echo "High-confidence secret pattern found"
            exit 1
          fi
