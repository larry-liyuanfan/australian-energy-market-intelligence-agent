groups:
  - name: energy-agent-service
    rules:
      - alert: EnergyAgentDown
        expr: up{job="energy-agent"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Energy Agent scrape target is unavailable
      - alert: EnergyAgentInsufficientEvidenceRatio
        expr: |
          sum(rate(energy_agent_queries_total{status="insufficient_evidence"}[5m]))
          / clamp_min(sum(rate(energy_agent_queries_total[5m])), 0.000001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of recent queries lack sufficient evidence
      - alert: EnergyAgentToolFailureRatio
        expr: |
          sum(rate(energy_agent_tool_calls_total{status=~"error|timeout"}[5m]))
          / clamp_min(sum(rate(energy_agent_tool_calls_total[5m])), 0.000001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of recent typed-tool attempts failed
      - alert: EnergyAgentP95LatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(energy_agent_query_duration_seconds_bucket[5m]))) > 10
          and sum(rate(energy_agent_query_duration_seconds_count[5m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Agent query P95 latency exceeds the 10-second service gate
      - alert: EnergyAgentTraceEvictionsHigh
        expr: increase(energy_agent_trace_evictions_total[15m]) > 128
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: In-process trace cache is turning over unusually quickly
